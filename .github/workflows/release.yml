name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  tag:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?$ ]]'
  check:
    needs: tag
    uses: ./.github/workflows/ci.yml
  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: userscript
          path: dist
      - name: Upload userscript to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/pdd-order-export.user.js --repo "$GITHUB_REPOSITORY"
