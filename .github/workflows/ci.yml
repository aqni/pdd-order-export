name: CI
on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failures
          path: test-results/
          retention-days: 7
      - name: Get userscript version
        id: version
        run: |
          version=$(npm run --silent version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: userscript-${{ steps.version.outputs.version }}
          path: dist/pdd-order-export.user.js
          if-no-files-found: error
  release:
    needs: build
    if: >-
      github.event_name == 'release' &&
      github.ref_name == format('v{0}', needs.build.outputs.version)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: userscript-${{ needs.build.outputs.version }}
          path: dist
      - name: Upload userscript to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/pdd-order-export.user.js --clobber --repo "$GITHUB_REPOSITORY"
